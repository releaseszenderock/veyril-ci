# Authoritative CI orchestration for the private zenderock/veyril source.
# This file is versioned in the private source as the canonical template and
# should be installed at .github/workflows/gate.yml in releaseszenderock/veyril-ci.
name: Veyril Gate

run-name: Gate ${{ inputs.SOURCE_REF }}${{ inputs.LABEL != '' && format(' ({0})', inputs.LABEL) || '' }}

on:
  workflow_dispatch:
    inputs:
      SOURCE_REF:
        description: Branch, tag or exact commit from zenderock/veyril
        required: true
        default: main
        type: string
      LABEL:
        description: Optional human-readable label
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: veyril-gate-${{ inputs.SOURCE_REF }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    env:
      SOURCE_REPOSITORY: zenderock/veyril
      STATUS_CONTEXT: veyril-ci/gate

    steps:
      - name: Check out private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zenderock/veyril
          ref: ${{ inputs.SOURCE_REF }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          persist-credentials: false
          path: source

      - name: Resolve source commit
        shell: bash
        env:
          REQUESTED_SOURCE_REF: ${{ inputs.SOURCE_REF }}
        run: |
          sha="$(git -C source rev-parse HEAD)"
          echo "SOURCE_SHA=${sha}" >> "$GITHUB_ENV"
          {
            echo "### Veyril source"
            echo ""
            echo "\`zenderock/veyril\` ref \`${REQUESTED_SOURCE_REF}\`"
            echo ""
            echo "Commit: \`${sha}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report pending status to private source
        shell: bash
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
          TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          test -n "$SOURCE_REPO_TOKEN"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $SOURCE_REPO_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$SOURCE_REPOSITORY/statuses/$SOURCE_SHA" \
            -d "$(jq -cn \
              --arg state pending \
              --arg target_url "$TARGET_URL" \
              --arg description "Veyril public CI is running" \
              --arg context "$STATUS_CONTEXT" \
              '{state:$state,target_url:$target_url,description:$description,context:$context}')"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: source/backend/go.mod
          cache-dependency-path: source/backend/go.sum

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: source/.node-version

      - name: Install pinned pnpm dependencies and Rust toolchain
        working-directory: source
        shell: bash
        run: |
          corepack enable
          corepack prepare "$(node -p 'require("./package.json").packageManager')" --activate
          pnpm install --frozen-lockfile
          rustup show

      - name: Tool versions
        working-directory: source
        shell: bash
        run: |
          go version
          rustc --version
          cargo --version
          pnpm exec buf --version
          python3 --version

      - name: Run source-controlled quality gate
        working-directory: source
        shell: bash
        run: bash scripts/ci/public-gate.sh

      - name: Report final status to private source
        if: ${{ always() && env.SOURCE_SHA != '' }}
        shell: bash
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
          TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GATE_JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$GATE_JOB_STATUS" = "success" ]; then
            state="success"
            description="Veyril public CI passed"
          else
            state="failure"
            description="Veyril public CI failed"
          fi

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $SOURCE_REPO_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$SOURCE_REPOSITORY/statuses/$SOURCE_SHA" \
            -d "$(jq -cn \
              --arg state "$state" \
              --arg target_url "$TARGET_URL" \
              --arg description "$description" \
              --arg context "$STATUS_CONTEXT" \
              '{state:$state,target_url:$target_url,description:$description,context:$context}')"
